<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ page_title }} · GUNB Lead Tool{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Przejdź do treści</a>
    <header class="site-header">
      {% include "components/navbar.html" %}
    </header>
    <main class="container main-content" id="main-content" tabindex="-1">
      {% block content %}
      <section class="preparation" aria-labelledby="page-heading">
        <p class="eyebrow">Dane o inwestycjach dla firm</p>
        <h1 id="page-heading">Portal B2B w przygotowaniu</h1>
        <p class="intro">W tym miejscu pojawią się informacje o portalu i dostępie do danych o inwestycjach budowlanych.</p>
      </section>
      {% endblock %}
    </main>
    <footer class="site-footer">
      <div class="container">GUNB Lead Tool · dane z rejestru RWDZ</div>
    </footer>
  </body>
</html>
