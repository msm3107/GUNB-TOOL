# ============================================================================
#  GUNB Lead Tool – konfiguracja
#
#  • Sekretów NIE wpisuj tutaj – używaj placeholderów ${ZMIENNA} lub ${ZMIENNA:-domyślna};
#    wartości trzymaj w zmiennych środowiskowych albo w pliku .env (wzór: .env.example).
#  • Ścieżki względne liczone są od katalogu tego pliku.
#  • Kody TERYT zawsze w cudzysłowie ("0201"), inaczej YAML może je przeczytać jako liczby.
# ============================================================================

gunb:
  # Źródła – oficjalne paczki „Dane do pobrania” z wyszukiwarka.gunb.gov.pl (aktualizacja co noc):
  #   pozwolenia – Rejestr Wniosków i Decyzji (osobny plik na województwo, dane od 2016 r.)
  #   zgloszenia – Rejestr Zgłoszeń od 2022 r. (jeden plik dla całego kraju, ~25 MB ZIP)
  sources: [pozwolenia, zgloszenia]

  # Województwa (kody TERYT lub nazwy):
  #   02 dolnośląskie  04 kujawsko-pomorskie  06 lubelskie   08 lubuskie
  #   10 łódzkie       12 małopolskie         14 mazowieckie 16 opolskie
  #   18 podkarpackie  20 podlaskie           22 pomorskie   24 śląskie
  #   26 świętokrzyskie 28 warmińsko-mazurskie 30 wielkopolskie 32 zachodniopomorskie
  voivodeships: ["28"]

  # Powiaty do monitorowania (4-cyfrowe kody TERYT). Pusta lista = całe województwo.
  # 2862 – m. Olsztyn (miasto na prawach powiatu), 2814 – powiat olsztyński (gminy wokół miasta).
  # Inne przykłady: 1261 – m. Kraków, 1206 – powiat krakowski, 1465 – m.st. Warszawa.
  powiats: ["2862", "2814"]

  # Data używana przy filtrowaniu pozwoleń: "decyzja" (data wydania) lub "wplyw" (data złożenia).
  # Zgłoszenia mają wyłącznie datę wpływu i zawsze są filtrowane po niej.
  date_field: decyzja

  # Okno czasowe w dniach, gdy w CLI nie podano --since / --days. Urzędy wprowadzają sprawy
  # do RWDZ z opóźnieniem (zgłoszenia nawet kilka tygodni), więc okno powinno być szerokie –
  # sprawy już znane są rozpoznawane po numerze i nie generują ponownych powiadomień.
  lookback_days: 60

  # Paginacja przetwarzania: liczba spraw na stronę (geokodowanie + zapis w jednej transakcji).
  page_size: 200

  cache_dir: data/cache

filter:
  # Odrzucaj rekordy uznane za szum.
  drop_noise: true

  # Traktuj rozbiórki jako szum – chyba że opis obejmuje też budowę / przebudowę / rozbudowę
  # (np. „rozbiórka starego domu i budowa nowego budynku mieszkalnego” pozostaje leadem).
  drop_demolitions: true

  # Słowa wykluczające (rdzenie słów; polskie znaki opcjonalne; można użyć wyrażeń regularnych).
  # Rekord jest szumem, gdy takie słowo stoi w opisie PRZED słowem opisującym budynek:
  #   „Przyłącze gazowe do budynku mieszkalnego”                → szum
  #   „Budowa budynku mieszkalnego wraz z przyłączami i zjazdem” → lead
  exclude_keywords:
    - ogrodzen        # ogrodzenia
    - zjazd           # zjazdy z drogi publicznej
    - przyłącz        # przyłącza
    - sieć
    - sieci
    - gazow           # instalacje / sieci / zbiorniki gazowe
    - gazociąg
    - wodociąg
    - kanalizac
    - elektroenerget
    - kablow
    - napowietrzn
    - oświetleni
    - telekomunikac
    - bazow           # stacje bazowe telefonii
    - maszt
    - reklam          # nośniki reklamowe
    - fotowolt
    - wiatrow         # elektrownie wiatrowe
    - zbiornik
    - oczyszczal      # przydomowe oczyszczalnie ścieków
    - szamb
    - studni
    - drog            # drogi, przebudowy dróg
    - chodnik
    - parking
    - melioracj

  # Kategorie obiektów (I–XXX) traktowane jako szum, o ile opis nie wskazuje na budynek:
  #   IV zjazdy/skrzyżowania, XXII parkingi/place, XXV drogi, XXVI sieci, XXVIII mosty, XXIX maszty...
  noise_categories: [IV, VI, VII, XXI, XXII, XXIII, XXIV, XXV, XXVI, XXVII, XXVIII, XXIX, XXX]

  # Zostaw tylko wybrane kategorie leadów (pusta lista = wszystko poza szumem). Dostępne:
  #   mieszkaniowa-jednorodzinna, mieszkaniowa-wielorodzinna, mieszana, komercyjna,
  #   publiczna, rolnicza, inna
  include_categories: []

# Segmenty klientów – lead trafia do PIERWSZEGO pasującego segmentu (kolejność ma znaczenie).
# Warunki: kategoria leada z listy `categories` i kubatura w zakresie min/max (nieznana kubatura,
# typowa dla zgłoszeń, nie wyklucza). `telegram_chat_id` kieruje segment na osobny czat/kanał –
# puste = domyślny czat (TELEGRAM_CHAT_ID). Leady bez segmentu (rolnicze, inne) też idą na domyślny.
segments:
  domki:
    label: Domki jednorodzinne
    categories: [mieszkaniowa-jednorodzinna]
    max_kubatura: 2500     # powiat poznański: mediana domu 878 m³, 90% poniżej 1540 m³
    telegram_chat_id: ${TELEGRAM_CHAT_ID_DOMKI}
  duze:
    label: Duże inwestycje / wielorodzinne
    categories: [mieszkaniowa-jednorodzinna, mieszkaniowa-wielorodzinna, mieszana, komercyjna, publiczna]
    telegram_chat_id: ${TELEGRAM_CHAT_ID_DUZE}

# Interaktywny bot Telegram (python main.py --bot) – każdy użytkownik ustawia własne filtry,
# tryb raportów i „tylko HOT”, zapisuje leady i obserwuje inwestorów/gminy.
bot:
  # Administrator (ADMIN_CHAT_ID w .env; puste = TELEGRAM_CHAT_ID) – nadaje dostęp komendami
  #   /aktywuj <chat_id> <dni|data>   np. /aktywuj 9876543 30 albo /aktywuj 9876543 2026-12-31
  #   /przedluz <chat_id> <dni|data>  to samo (dni liczone od końca obecnego dostępu)
  #   /odbierz <chat_id>              wyłącza dostęp od razu (zapisane i ustawienia klienta zostają)
  #   /trial <chat_id>                pozwala na 7-dniowy test – rusza, gdy klient kliknie ▶️ (raz na osobę)
  #   /nowymodel <chat_id|wszyscy> <dni|data>   termin dla dotychczasowych użytkowników (bez terminu)
  #   /status                         import GUNB, wątek zadań i wysyłki z ostatniej doby
  # albo przyciskami na karcie nowej osoby. Sam ma dostęp bez abonamentu.
  admins: ["${ADMIN_CHAT_ID}"]
  # Nick admina pokazywany osobom bez dostępu („Skontaktuj się z administratorem @nick…”).
  # Puste = klikalny link do admina po ID.
  admin_contact: ${ADMIN_CONTACT}
  # approval – dostęp tylko z testem albo abonamentem nadanym przez admina; open – dostęp dla każdego.
  access: approval
  # O której bot sam pobiera dane GUNB (paczki są aktualizowane ok. 23:30). [] = tylko przez --fetch.
  # 06:30 – przed raportem porannym; 13:30 – na wypadek, gdy GUNB opublikuje paczkę z opóźnieniem
  # (bez zmian w paczce to tylko krótkie sprawdzenie: plik się nie pobiera, nic nie jest wysyłane drugi raz).
  fetch_times: ["06:30", "13:30"]
  morning_time: "07:00"
  evening_time: "19:00"
  # Co ile minut sprawdzać alerty 👀 watchlisty i tryb „⚡ od razu”.
  instant_every_minutes: 10
  # Z ilu dni wstecz nowa osoba dostaje leady w pierwszym raporcie.
  welcome_backlog_days: 7
  max_leads_in_report: 20
  # Oferta dalszego dostępu – bot pokazuje ją przed testem, na ekranie konta, przed końcem i po końcu
  # dostępu. Wartości wpisuj w .env (repozytorium jest publiczne). Dopóki brakuje ceny, sposobu podatku,
  # sposobu płatności albo danych sprzedawcy, bot nie pokazuje ceny ani przycisku zamówienia – tylko
  # „💬 Zapytaj o ofertę”. Brakujące pola pokazuje adminowi /dane. Wzór: .env.example.
  offer:
    name: ${OFERTA_NAZWA:-Żółta Tablica}
    area: ${OFERTA_OBSZAR:-Olsztyn i powiat olsztyński}
    accounts: ${OFERTA_KONTA:-1}              # ile kont Telegram obejmuje jeden dostęp
    price: ${OFERTA_CENA:-}                   # np. 99 – decyzja operatora (hipoteza pilotażu)
    currency: ${OFERTA_WALUTA:-PLN}
    period_days: ${OFERTA_DNI:-30}
    tax: ${OFERTA_PODATEK:-}                  # netto_vat | brutto | bez_vat
    vat_rate: ${OFERTA_VAT:-23}               # tylko przy netto_vat
    payment: ${OFERTA_PLATNOSC:-}             # np. przelew – dane w potwierdzeniu zamówienia
    seller_name: ${OFERTA_SPRZEDAWCA:-}
    seller_contact: ${OFERTA_KONTAKT:-}
    renewal: ${OFERTA_ODNOWIENIE:-Dostęp nie odnawia się sam – przed końcem przypomnę o przedłużeniu.}
    terms_url: ${OFERTA_ZASADY_URL:-}
    privacy_url: ${OFERTA_PRYWATNOSC_URL:-}
    response_time: ${OFERTA_ODPOWIEDZ:-}      # np. w dni robocze 16:00–20:00 (puste = nie pokazuj)

geocoding:
  enabled: true
  # Ile działek sprawy próbować zlokalizować w ULDK, zanim użyjemy środka obrębu.
  max_parcels_per_case: 3
  # Gdy żadna działka nie istnieje (np. po podziale) – współrzędne środka obrębu.
  region_fallback: true
  # Losowe opóźnienie między zapytaniami do ULDK (sekundy).
  min_delay: 0.2
  max_delay: 0.8
  # Po ilu dniach ponowić zapytanie o działkę, której ULDK nie znalazł.
  negative_cache_days: 30

http:
  timeout: 60
  max_retries: 3         # każde zapytanie: 3 ponowienia po błędzie sieci / 429 / 5xx, potem błąd
  backoff_base: 2        # wykładniczy backoff: 2, 4, 8 s (z losowym jitterem; Retry-After ma pierwszeństwo)
  backoff_max: 60
  min_delay: 1.0         # losowe opóźnienie między zapytaniami do GUNB
  max_delay: 3.0
  # Bezpiecznik: po 3 nieudanych zapytaniach z rzędu do jednego serwera (GUNB, ULDK) kolejne są od razu
  # odrzucane przez 10 min, zamiast czekać na każdy backoff – potem jedno zapytanie próbne. 0 = wyłączony.
  circuit_breaker_failures: 3
  circuit_breaker_cooldown: 600
  # user_agents:         # własna pula User-Agent (domyślnie 5 popularnych przeglądarek)
  #   - "Mozilla/5.0 ..."

storage:
  db_path: data/gunb_leads.sqlite
  # Kopia bazy raz dziennie: w nocnych porządkach bota (03:30) albo przed pobieraniem danych, jeśli
  # tego dnia jeszcze jej nie było (data w nazwie pliku; zostaje 14 najnowszych). Kopie leżą na tym
  # samym dysku – przechowuj je też gdzie indziej (docs/WDROZENIE.md, sekcja F).
  backup_dir: data/backups
  backup_every_days: 1
  backup_keep: 14
  # Od tylu nowych/zmienionych leadów w jednym pobieraniu po imporcie wykonywany jest VACUUM.
  vacuum_threshold: 500

notifications:
  # Najwięcej leadów obsłużonych na kanał w jednym uruchomieniu (reszta pójdzie przy następnym).
  max_leads_per_run: 200
  # Powyżej tylu leadów dla jednego czatu zamiast serii wiadomości idzie raport zbiorczy.
  digest_threshold: 10
  # Nie powiadamiaj o leadach, których status zmienił się dawniej niż N dni temu.
  max_age_days: 14

telegram:
  bot_token: ${TELEGRAM_BOT_TOKEN}
  chat_id: ${TELEGRAM_CHAT_ID}
  # Cichy kanał admina: awarie (GUNB/ULDK nie odpowiada, blokada bazy…) idą tylko tutaj, nie do klientów.
  # Puste = alerty wyłączone. Sprawdzenie: python main.py --test-alert
  admin_chat_id: ${TELEGRAM_ADMIN_CHAT_ID}
  delay_seconds: 1.0     # odstęp między wiadomościami; minimum 1 s (limit Telegrama: ~1 wiadomość/s na czat)

discord:
  webhook_url: ${DISCORD_WEBHOOK_URL}
  delay_seconds: 1.0

sheets:
  service_account_file: ${GOOGLE_SERVICE_ACCOUNT_FILE:-service_account.json}
  spreadsheet_id: ${GOOGLE_SHEET_ID}
  worksheet: Leady

logging:
  level: INFO
  file: data/gunb_tool.log
